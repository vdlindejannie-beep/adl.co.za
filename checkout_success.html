<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | Leather by Annuschka</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .success-card {
            max-width: 600px;
            margin: 80px auto;
            padding: 40px 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .success-icon {
            font-size: 48px;
            color: #2e7d32;
            margin-bottom: 16px;
        }
        .btn-home {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">✓</div>
        <h1>Thank You for Your Order!</h1>
        <p>Your payment was received successfully.</p>
        <p>We are preparing your leather craft and will notify you as soon as your PEP Paxi package ships.</p>
        <a href="/" class="btn-home">Return to Home</a>
    </div>
</body>
</html>
