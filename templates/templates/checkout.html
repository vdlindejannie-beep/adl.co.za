<form method="POST">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="address" placeholder="Shipping Address">
    
    <label>
        <input type="radio" name="delivery_method" value="courier" checked> Courier
    </label>
    <label>
        <input type="radio" name="delivery_method" value="pickup"> Pickup
    </label>
    
    <button type="submit">Pay with Payfast</button>
</form>
